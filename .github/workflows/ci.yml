name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Verify Go toolchain
        run: go version

      - name: Lint shell scripts
        run: |
          bash -n scripts/package.sh
          bash -n scripts/remote/start_server.sh
          for f in scripts/templates/*.sh; do bash -n "$f"; done

      - name: Vet and run race-checked tests
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Build & verify macOS bundle (zero CGO)
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --mac --zip
          ls -lh build/Colab-Tools-*.zip
