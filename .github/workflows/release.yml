name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build macOS release archive
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --mac --zip

      - name: Upload macOS zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/Colab-Tools-*-macOS-arm64.zip
