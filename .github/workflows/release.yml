name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.24)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Lint scripts, vet and run race-checked tests
        run: |
          for f in scripts/package.sh scripts/remote/start_server.sh scripts/templates/*.sh docs/examples/*.sh; do
            bash -n "$f" || exit 1
          done
          go vet ./...
          go test -race ./...

      - name: Build macOS release archive
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh --mac --zip

      - name: Upload macOS zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: build/Colab-Tools-*-macOS-arm64.zip
